# Dispatch scheduler for Vercel Hobby.
#
# Hobby runs Vercel Cron at most once a day, so this calls the drain endpoint
# every five minutes to send scheduled campaigns and retry transient failures.
# "Send now" does not wait for it: the web app dispatches right after the send.
#
# GitHub runs schedules on a best-effort basis. Runs can start late at busy
# times, and the schedule is disabled after 60 days without repository activity.
# See docs/DEPLOYMENT.md.
#
# Setup: repository variable APP_URL (e.g. https://ph-sms.vercel.app) and
# repository secret CRON_SECRET, the same value as in Vercel.

name: Dispatch due SMS jobs

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: dispatch
  cancel-in-progress: false

permissions: {}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Drain due jobs
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::notice::APP_URL or CRON_SECRET is not configured; nothing to call."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 330 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${APP_URL%/}/api/cron/dispatch"
